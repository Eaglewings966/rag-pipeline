name: CI — Build, Test, Scan, Push

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write  # Required for OIDC
  pull-requests: write

env:
  AWS_REGION: us-east-1

jobs:
  # -------------------------------------------------------
  # STAGE 1 — LINT AND TEST
  # -------------------------------------------------------
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install black ruff mypy pytest

      - name: Lint with ruff
        run: ruff check apps/

      - name: Format check with black
        run: black --check apps/

      - name: Type check with mypy
        run: mypy apps/ --ignore-missing-imports || true

      - name: Run tests
        run: |
          pip install pytest httpx fastapi
          python -m pytest tests/ -v --tb=short || true

  # -------------------------------------------------------
  # STAGE 2 — SECURITY SCAN
  # -------------------------------------------------------
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-test

    steps:
      - uses: actions/checkout@v4

      - name: Scan Terraform with Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true

      - name: Scan Kubernetes manifests with Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: k8s/
          framework: kubernetes
          soft_fail: true

      - name: Run Trivy on filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-results.sarif"

  # -------------------------------------------------------
  # STAGE 3 — BUILD AND PUSH
  # Only on push to main
  # -------------------------------------------------------
  build-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: [lint-test, security-scan]
    if: github.ref == 'refs/heads/main'

    strategy:
      matrix:
        service:
          - name: rag-api
            path: apps/rag-api
          - name: auth-service
            path: apps/auth-service
          - name: rate-limiter
            path: apps/rate-limiter
          - name: metrics-exporter
            path: apps/metrics-exporter
          - name: ingestion
            path: apps/ingestion

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, scan, and push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          SERVICE: ${{ matrix.service.name }}
          SERVICE_PATH: ${{ matrix.service.path }}
        run: |
          # Build
          docker build \
            -t ${ECR_REGISTRY}/${{ secrets.ECR_REPOSITORY }}/${SERVICE}:${IMAGE_TAG} \
            -t ${ECR_REGISTRY}/${{ secrets.ECR_REPOSITORY }}/${SERVICE}:latest \
            ${SERVICE_PATH}

          # Scan with Trivy — block on CRITICAL
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity CRITICAL \
            --exit-code 1 \
            ${ECR_REGISTRY}/${{ secrets.ECR_REPOSITORY }}/${SERVICE}:${IMAGE_TAG}

          # Push
          docker push ${ECR_REGISTRY}/${{ secrets.ECR_REPOSITORY }}/${SERVICE}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${{ secrets.ECR_REPOSITORY }}/${SERVICE}:latest

          echo "Pushed: ${ECR_REGISTRY}/${{ secrets.ECR_REPOSITORY }}/${SERVICE}:${IMAGE_TAG}"

  # -------------------------------------------------------
  # STAGE 4 — ARGO CD SYNC TRIGGER
  # -------------------------------------------------------
  deploy:
    name: Trigger Argo CD Sync
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ secrets.CLUSTER_NAME }}

      - name: Install Argo CD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Sync Argo CD applications
        run: |
          # Port-forward ArgoCD server
          kubectl port-forward svc/argocd-server -n argocd 8080:443 &
          sleep 3

          # Login
          ARGOCD_PASSWORD=$(kubectl -n argocd get secret argocd-initial-admin-secret \
            -o jsonpath="{.data.password}" | base64 -d)
          argocd login localhost:8080 \
            --username admin \
            --password ${ARGOCD_PASSWORD} \
            --insecure

          # Sync in wave order
          argocd app sync platform-services --wait
          argocd app sync security-services --wait
          argocd app sync rag-application --wait

          echo "All applications synced successfully"
