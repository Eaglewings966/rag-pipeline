# KEDA ScaledObject — scale rag-api on queue depth metric
# Prometheus metric: rag_queue_depth
# Second pod when queue exceeds 3 concurrent requests
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: rag-api-scaler
  namespace: rag-api
spec:
  scaleTargetRef:
    name: rag-api
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 120
  pollingInterval: 15
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        metricName: rag_queue_depth
        query: sum(rag_queue_depth)
        threshold: "3"
        activationThreshold: "1"
---
# KEDA ScaledObject for Qdrant
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: qdrant-scaler
  namespace: qdrant
spec:
  scaleTargetRef:
    name: qdrant
  minReplicaCount: 1
  maxReplicaCount: 3
  cooldownPeriod: 300
  pollingInterval: 30
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        metricName: rag_requests_total
        query: rate(rag_requests_total[5m])
        threshold: "50"
---
# HPA as backup for rag-api (CPU-based)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-api-hpa
  namespace: rag-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-api
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
