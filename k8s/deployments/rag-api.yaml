apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: rag-api
  labels:
    app: rag-api
    version: "1.0"
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rag-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: rag-api
        version: "1.0"
      annotations:
        prometheus.io/scrape: "false"  # metrics-exporter handles scraping
    spec:
      serviceAccountName: rag-api  # IRSA for S3 access
      nodeSelector:
        role: application
      tolerations:
        - key: node-role
          operator: Equal
          value: application
          effect: NoSchedule
      containers:
        - name: rag-api
          image: YOUR_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/rag-pipeline/rag-api:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: QDRANT_URL
              value: "http://qdrant.qdrant.svc.cluster.local:6333"
            - name: QDRANT_COLLECTION
              value: "documents"
            - name: LLM_PROVIDER
              value: "anthropic"
            - name: TOP_K_CHUNKS
              value: "5"
            - name: SIMILARITY_THRESHOLD
              value: "0.7"
            - name: CLAUDE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: claude-api-key
                  key: CLAUDE_API_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
        - name: metrics-exporter
          image: YOUR_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/rag-pipeline/metrics-exporter:latest
          ports:
            - containerPort: 8003
              name: metrics
          env:
            - name: RAG_API_URL
              value: "http://localhost:8000"
            - name: CLAUDE_PROMPT_PRICE_PER_1K
              value: "0.003"
            - name: CLAUDE_COMPLETION_PRICE_PER_1K
              value: "0.015"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - rag-api
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-api
  namespace: rag-api
  annotations:
    eks.amazonaws.com/role-arn: YOUR_RAG_API_ROLE_ARN
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
  namespace: rag-api
  labels:
    app: rag-api
spec:
  selector:
    app: rag-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
    - name: metrics
      port: 8003
      targetPort: 8003
  type: ClusterIP
