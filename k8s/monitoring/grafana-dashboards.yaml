apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  rag-cluster-overview.json: |
    {
      "title": "RAG Pipeline — Cluster Overview",
      "uid": "rag-cluster-overview",
      "panels": [
        {
          "title": "Node CPU Usage",
          "type": "stat",
          "targets": [{
            "expr": "100 - (avg by(node) (rate(node_cpu_seconds_total{mode='idle'}[5m])) * 100)"
          }]
        },
        {
          "title": "Node Memory Usage",
          "type": "stat",
          "targets": [{
            "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100"
          }]
        },
        {
          "title": "Pod Health by Namespace",
          "type": "table",
          "targets": [{
            "expr": "kube_pod_status_phase{namespace=~'rag-api|qdrant|monitoring'}"
          }]
        },
        {
          "title": "RAG API Replicas",
          "type": "stat",
          "targets": [{
            "expr": "kube_deployment_status_replicas_ready{deployment='rag-api'}"
          }]
        }
      ]
    }
  rag-inference-metrics.json: |
    {
      "title": "RAG Pipeline — Inference Metrics",
      "uid": "rag-inference-metrics",
      "panels": [
        {
          "title": "Request Rate",
          "type": "timeseries",
          "targets": [{
            "expr": "rate(rag_requests_total[5m])",
            "legendFormat": "{{status_code}} {{endpoint}}"
          }]
        },
        {
          "title": "p50 Latency",
          "type": "stat",
          "targets": [{
            "expr": "histogram_quantile(0.5, rate(rag_request_duration_seconds_bucket[5m]))"
          }]
        },
        {
          "title": "p95 Latency",
          "type": "stat",
          "targets": [{
            "expr": "histogram_quantile(0.95, rate(rag_request_duration_seconds_bucket[5m]))"
          }]
        },
        {
          "title": "p99 Latency",
          "type": "stat",
          "targets": [{
            "expr": "histogram_quantile(0.99, rate(rag_request_duration_seconds_bucket[5m]))"
          }]
        },
        {
          "title": "Error Rate",
          "type": "timeseries",
          "targets": [{
            "expr": "rate(rag_requests_total{status_code=~'5..'}[5m]) / rate(rag_requests_total[5m])"
          }]
        },
        {
          "title": "Queue Depth",
          "type": "timeseries",
          "targets": [{
            "expr": "sum(rag_queue_depth)",
            "legendFormat": "Active requests"
          }]
        },
        {
          "title": "Retrieval Latency p95",
          "type": "stat",
          "targets": [{
            "expr": "histogram_quantile(0.95, rate(rag_retrieval_duration_seconds_bucket[5m]))"
          }]
        }
      ]
    }
  rag-llm-metrics.json: |
    {
      "title": "RAG Pipeline — LLM Metrics",
      "uid": "rag-llm-metrics",
      "panels": [
        {
          "title": "Tokens Per Minute",
          "type": "timeseries",
          "targets": [{
            "expr": "rate(rag_total_tokens_total[1m]) * 60",
            "legendFormat": "tokens/min"
          }]
        },
        {
          "title": "Prompt vs Completion Tokens",
          "type": "timeseries",
          "targets": [
            {
              "expr": "rate(rag_prompt_tokens_total[5m])",
              "legendFormat": "Prompt tokens/s"
            },
            {
              "expr": "rate(rag_completion_tokens_total[5m])",
              "legendFormat": "Completion tokens/s"
            }
          ]
        },
        {
          "title": "Estimated Cost Per Hour (USD)",
          "type": "stat",
          "targets": [{
            "expr": "rate(rag_token_cost_usd_total[1h]) * 3600",
            "legendFormat": "$/hour"
          }]
        },
        {
          "title": "Chunks Retrieved per Query",
          "type": "timeseries",
          "targets": [{
            "expr": "histogram_quantile(0.5, rate(rag_chunks_retrieved_bucket[5m]))"
          }]
        },
        {
          "title": "Generation Duration p95",
          "type": "stat",
          "targets": [{
            "expr": "histogram_quantile(0.95, rate(rag_request_duration_seconds_bucket{endpoint='/query'}[5m]))"
          }]
        },
        {
          "title": "Total Tokens Consumed (cumulative)",
          "type": "stat",
          "targets": [{
            "expr": "rag_total_tokens_total"
          }]
        }
      ]
    }
