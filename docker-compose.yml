services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports: ["6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]
  rag-api:
    build: ./apps/rag-api
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports: ["8000:8000"]
    depends_on: [qdrant]
  ingestion:
    build: ./apps/ingestion
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    profiles: ["tools"]
    depends_on: [qdrant]
volumes:
  qdrant-data:
